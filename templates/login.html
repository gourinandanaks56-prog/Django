<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DentalCare | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf8ff, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Container */
        .login-container {
            width: 900px;
            min-height: 540px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 45px rgba(0, 80, 120, 0.15);
        }

        /* Left Side */
        .login-left {
            width: 50%;
            background: linear-gradient(145deg, #079bd8, #087eb5);
            color: white;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            background: white;
            color: #079bd8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .login-left h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .login-left h1 span {
            color: #dff7ff;
        }

        .login-left p {
            font-size: 15px;
            line-height: 1.7;
            color: #e4f8ff;
            max-width: 330px;
        }

        .medical-icon {
            font-size: 65px;
            margin-top: 35px;
        }

        /* Right Side */
        .login-right {
            width: 50%;
            padding: 55px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-right h2 {
            color: #163e55;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #78909c;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Error Message */
        .error {
            background: #fff0f0;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #37474f;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            padding: 0 15px 0 45px;
            border: 1px solid #d6e5eb;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            color: #37474f;
            background: #fafdff;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #079bd8;
            box-shadow: 0 0 0 3px rgba(7,155,216,0.10);
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #079bd8, #087eb5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(7,155,216,0.25);
        }

        /* Bottom Text */
        .bottom-text {
            text-align: center;
            margin-top: 25px;
            color: #78909c;
            font-size: 14px;
        }

        .bottom-text a {
            color: #079bd8;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 800px) {

            .login-container {
                width: 92%;
                min-height: auto;
            }

            .login-left {
                display: none;
            }

            .login-right {
                width: 100%;
                padding: 45px 30px;
            }
        }

        @media (max-width: 450px) {

            .login-right {
                padding: 35px 22px;
            }

            .login-right h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-left">

            <div class="logo">
                ✚
            </div>

            <h1>
                Dental<span>Care</span>
            </h1>

            <p>
                Welcome back to DentalCare Hospital.
                Login to access your appointments,
                treatment details and patient services.
            </p>

            <div class="medical-icon">
                🦷
            </div>

        </div>


        <!-- Right Side -->
        <div class="login-right">

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to your DentalCare account
            </p>


            {% if error %}
                <div class="error">
                    ⚠ {{ error }}
                </div>
            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- Username -->
                <div class="form-group">

                    <label>Username</label>

                    <div class="input-box">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- Login -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <div class="bottom-text">
                Don't have an account?
                <a href="{% url 'patient_register' %}">
                    Register as Patient
                </a>
            </div>

        </div>

    </div>

</body>
</html>
